[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "trader-trainer"
version = "0.1.0"
description = "Desktop-first historical market replay and manual trading trainer"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["runtime_bootstrap*", "desktop_shell*"]
exclude = ["tests*", ".tcl_runtime*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
  ".git",
  ".venv",
  ".tcl_runtime",
  "tests/.tmp_*",
  "desktop_shell/.local_state",
]

[tool.ruff.lint]
# Start with correctness-critical rules. Broader style cleanup must be a separate bounded task.
select = ["E9", "F63", "F7", "F82"]