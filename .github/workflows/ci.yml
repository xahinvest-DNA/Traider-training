name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runtime-linux:
    name: Runtime core / Ubuntu / Python 3.11
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Compile runtime
        run: python -m compileall runtime_bootstrap

      - name: Correctness lint
        run: python -m ruff check .

      - name: Run runtime tests
        run: python -m pytest tests/test_replay_bootstrap.py

  full-windows:
    name: Full suite / Windows / Python 3.11
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Compile runtime and desktop modules
        run: python -m compileall runtime_bootstrap desktop_shell

      - name: Correctness lint
        run: python -m ruff check .

      - name: Run full test suite
        run: python -m pytest
